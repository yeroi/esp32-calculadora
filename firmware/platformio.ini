; =============================================================================
;  ESP32 SciCalc — proyecto PlatformIO
; -----------------------------------------------------------------------------
;  El código vive en "sketch/" para que la MISMA carpeta sirva también en
;  Wokwi (web) y en el IDE de Arduino sin cambiar nada.
;
;  Paso 3: framework Arduino (núcleo arduino-esp32 2.x, ESP-IDF 4.4 debajo).
;  En el Paso 5 (MicroPython embed) pasaremos a "framework = arduino, espidf"
;  para poder compilar MicroPython como componente de ESP-IDF.
; =============================================================================
[platformio]
src_dir = sketch
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_dtr = 0                 ; no reiniciar el ESP32 al abrir el monitor
monitor_rts = 0
board_build.partitions = huge_app.csv   ; 3 MB de app: hará falta con MicroPython
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    ; PNGdec: buffer de línea para PNG de hasta 640 px de ancho en RGBA
    ; (por defecto solo 320). Cuesta ~2,5 KB más mientras se ve un PNG.
    -DPNG_MAX_BUFFERED_PIXELS=5122
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.0
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit BusIO@^1.17.0
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/PNGdec@^1.1.0
    bitbank2/AnimatedGIF@^2.2.0
    bblanchon/ArduinoJson@^7.4.0

; ELEGOO ESP32 DevKit (WROOM-32, 4 MB, sin PSRAM)
; MODO PC (por defecto en config.h): pantalla, teclado, SD y sonido en el PC
; con pc/scicalc_pantalla.py. No uses "pio device monitor" en este modo: el
; cable lo usa el programa del PC (que ya muestra los Serial.printf).
[env:esp32dev]
board = esp32dev
monitor_speed = 921600

; Hardware real o Wokwi: TFT ILI9341 + teclado matricial + MicroSD
[env:esp32dev-hw]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSCICALC_REMOTE=0
